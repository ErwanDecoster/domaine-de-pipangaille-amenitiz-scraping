---
name: Domaine de Pipangaille - Guest Manager
version: 1.0.2
slug: domaine-pipangaille-guest-manager
description: Retrieve guest information from Amenitiz booking platform with REST
  API for Home Assistant integration
url: https://github.com/erwandecoster/domaine-de-pipangaille-rooms-scraping
startup: application
boot: auto
init: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: REST API port
webui: http://[HOST]:[PORT:3000]/api/status
watchdog: http://[HOST]:[PORT:3000]/api/health
options:
  amenitiz_email:
  amenitiz_password:
  port: 3000
  headless: true
  screenshot: false
  data_retention_days: 7
  refresh_night_interval: 180
  refresh_morning_interval: 30
  refresh_afternoon_interval: 10
  refresh_evening_interval: 30
  refresh_night_start: 22
  refresh_morning_start: 8
  refresh_afternoon_start: 14
  cache_max_age_hours: 12
schema:
  amenitiz_email: str
  amenitiz_password: password
  port: port
  headless: bool
  screenshot: bool?
  data_retention_days: int(0,365)?
  refresh_night_interval: int(5,720)?
  refresh_morning_interval: int(5,720)?
  refresh_afternoon_interval: int(1,720)?
  refresh_evening_interval: int(5,720)?
  refresh_night_start: int(0,23)?
  cache_max_age_hours: int(1,168)?
  refresh_morning_start: int(0,23)?
  refresh_afternoon_start: int(0,23)?
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
homeassistant: 2024.1.0
host_network: true
privileged: []
environment:
  NODE_ENV: production
map:
  - config:rw
  - data:rw
documentation: https://github.com/erwandecoster/domaine-de-pipangaille-rooms-scraping/blob/main/README.md
